<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalGuide - Autentificare</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/autentification.css">
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">LocalGuide</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="events.html">Evenimente</a>
      <a href="login.html" class="btn-nav-auth">Autentificare</a>
    </nav>
  </header>

  <main class="auth-container">
    <form id="login-form" class="login-card">
      <h1 class="auth-title">Autentificare</h1>

      <div>
        <label for="login-email">Email</label>
        <input type="email" id="login-email" name="email" class="form-control" required>
      </div>

      <div>
        <label for="login-password">Parola</label>
        <input type="password" id="login-password" name="password" class="form-control" required>
      </div>

      <p id="login-error" class="auth-error"></p>

      <div class="login-actions">
        <button type="submit" class="btn-primary">Intră în cont</button>
        <a href="register.html" class="register-link">Creează cont</a>
      </div>
    </form>
  </main>

  <script src="../js/app.js"></script>
</body>
</html>
