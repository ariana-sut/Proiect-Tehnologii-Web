<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalGuide - Evenimente</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/events.css">
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">LocalGuide</a>
    <nav class="nav-links" id="nav-menu">
      <a href="index.html">Home</a>
      <a href="events.html" class="active">Evenimente</a>
      <a href="my-reservations.html" id="nav-reservations" style="display:none;">Rezervările mele</a>
      <a href="login.html" class="btn-nav-auth" id="nav-auth-btn">Autentificare</a>
    </nav>
  </header>

  <main class="events-layout">
    <aside class="filters-sidebar">
      <h2>Filtre</h2>
      <div>
        <label for="filter-search">Căutare</label>
        <input type="text" id="filter-search" class="form-control" placeholder="Caută tur">
      </div>
      <div>
        <label for="filter-theme">Temă</label>
        <select id="filter-theme" class="form-control">
          <option value="">Toate</option>
          <option value="arhitectura">Arhitectură</option>
          <option value="istorie">Patrimoniu istoric</option>
          <option value="street-art">Street art</option>
          <option value="gastronomie">Gastronomie tradițională</option>
        </select>
      </div>
      <div>
        <label for="filter-date">Data</label>
        <input type="date" id="filter-date" class="form-control">
      </div>
      <div>
        <label for="filter-price">Preț maxim (RON)</label>
        <input type="number" id="filter-price" class="form-control" placeholder="ex: 50" min="0">
      </div>
      <div>
        <label for="filter-duration">Durată</label>
        <select id="filter-duration" class="form-control">
          <option value="">Oricât</option>
          <option value="1h">1 oră</option>
          <option value="2h">2 ore</option>
          <option value="3h">3+ ore</option>
        </select>
      </div>
      <button type="button" id="apply-filters-btn" class="btn-primary">Aplică filtre</button>
    </aside>

    <section>
      <div class="tours-grid" id="tours-container"></div>
    </section>
  </main>

  <script src="../js/app.js"></script>
</body>
</html>
