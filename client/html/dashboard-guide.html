<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalGuide - Panou Ghid</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard-guide.css">
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">LocalGuide</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="events.html">Evenimente</a>
      <a href="dashboard-guide.html" class="active">Panou ghid</a>
      <a href="profile-guide.html">Profilul meu</a>
      <a href="#" class="btn-nav-auth" id="logout-btn">Deconectare</a>
    </nav>
  </header>

  <main class="dashboard-wrapper">
    <!-- Coloana Stângă: Publicare Tur Nou -->
    <section>
      <div class="panel-box">
        <h2>Publică un tur nou</h2>
        <form id="create-tour-form">
          <div class="form-group">
            <label for="tour-title-input">Titlu tur</label>
            <input type="text" id="tour-title-input" name="title" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="tour-theme-input">Temă</label>
              <select id="tour-theme-input" name="theme" required>
                <option value="arhitectura">Arhitectură</option>
                <option value="istorie">Patrimoniu istoric</option>
                <option value="street-art">Street art</option>
                <option value="gastronomie">Gastronomie tradițională</option>
              </select>
            </div>
            <div class="form-group">
              <label for="tour-price-input">Preț (RON)</label>
              <input type="number" id="tour-price-input" name="price" min="0" step="0.01" value="0" required>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="tour-duration-input">Durată (ore)</label>
              <input type="number" id="tour-duration-input" name="duration_hours" min="0.5" step="0.5" value="2" required>
            </div>
            <div class="form-group">
              <label for="tour-meeting-input">Punct de întâlnire</label>
              <input type="text" id="tour-meeting-input" name="meeting_point" placeholder="ex: Piața Unirii, Dom" required>
            </div>
          </div>
          <div class="form-group">
            <label for="tour-desc-input">Descriere</label>
            <textarea id="tour-desc-input" name="description" rows="3" required></textarea>
          </div>

          <div class="form-group">
            <label for="tour-image-file">Fotografie tur (opțional)</label>
            <input type="file" id="tour-image-file" name="image" accept="image/*">
          </div>
          <hr class="panel-divider">
          <div class="form-row">
            <div class="form-group">
              <label for="tour-datetime-input">Dată și oră</label>
              <input type="datetime-local" id="tour-datetime-input" name="date_time" required>
            </div>
            <div class="form-group">
              <label for="tour-spots-input">Locuri maxime</label>
              <input type="number" id="tour-spots-input" name="max_spots" min="1" value="10" required>
            </div>
          </div>
          <button type="submit" class="btn-primary">Publică turul</button>
        </form>
      </div>
    </section>

    <!-- Coloana Dreaptă: Cereri de rezervare + Tururile mele -->
    <section>
      <div class="panel-box">
        <h2>Cereri de rezervare primite</h2>
        <div id="guide-reservations-list"></div>
      </div>

      <div class="panel-box">
        <h2>Tururile mele publicate</h2>
        <div id="guide-my-tours-list"></div>
      </div>
    </section>
  </main>

  <script src="../js/app.js"></script>
</body>
</html>
